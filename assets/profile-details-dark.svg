<title id="details-title">Tsunami / CRUD5th — Tech Stack, About Me and Connect</title>
<desc id="details-description">Elixir, Ada, Zig, Rust, TypeScript and Python at the core. Web interfaces, server frameworks, systems and tools. Tsunami builds as CRUD5th across full-stack web development, AI &amp; LLMs, and low-level OS development. Design, Build, Release, Operate. Social links follow below.</desc>
<style>:root{--ink:#e6edf3;--muted:#a7b7c7;--rule:#28414f;--accent:#36f4ef;--secondary:#ff4cce;color-scheme:dark}
text{font-family:Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;fill:var(--ink)}
