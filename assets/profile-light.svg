<desc id="profile-description">Freelance Full-Stack / AI &amp; LLM Engineer | TypeScript, Python, Rust | Design → Build → Release → Operate | CRUD5th. CRUD5thOfficial/crud5th-web: ; crudfifth/crudfifth: ; crudfifth/www: . crudfifth + CRUD5thOfficial。repo統計と活動は公開データ。言語は個人＋組織の公開＋非公開・非fork repoのdefault branchをGitHubが判定したコードbytes割合。活動は個人＋組織の公開イベント取得分。フォロワーは個人の値。</desc>
<style>:root{--ink:#202831;--muted:#576571;--rule:#cbd2d9;--accent:#a8440b;--soft:#e3e8ed;color-scheme:light}
